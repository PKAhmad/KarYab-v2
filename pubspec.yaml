name: karyab
description: KarYab - Job Finder for Afghan Workers in Germany
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.38.4'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  provider: ^6.1.2
  image_picker: ^1.0.7
  pdf: ^3.10.8
  printing: ^5.12.0
  http: ^1.2.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  audioplayers: ^5.2.1
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  image_cropper: ^12.2.1
  file_picker: ^8.0.0
  share_plus: ^10.0.0
  permission_handler: ^11.3.1
  webview_flutter: ^4.8.0
  geolocator: ^13.0.0
  geocoding: ^3.0.0
  media_store_plus: ^0.1.3
  path_provider: ^2.1.5
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  google_sign_in: ^6.3.0
  speech_to_text: ^7.5.0
  flutter_email_sender: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/ps/
    - assets/audio/fa/
    - assets/audio/ar/
    - assets/templates/thumbnails/
    - assets/templates/
    - assets/fonts/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
    # Arabic script for Pashto/Dari UI text (Phase 5). Static hinted TTFs
    # from the official Noto project (notofonts/notofonts.github.io),
    # SIL Open Font License 1.1, see assets/fonts/NotoNaskhArabic_OFL.txt.
    # Verified 2026-11-06: cmap covers the Pashto-specific letters
    # U+067C U+0689 U+0691 U+0696 U+069A U+06BC U+06D0 in both weights.
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
